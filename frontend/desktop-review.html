<!doctype html><html><head><meta charset="UTF-8"><title>12-KOUL · Desktop QA</title><style>body{margin:0;background:#2b251f;color:#fff;font:13px system-ui}header{height:48px;display:flex;align-items:center;gap:10px;padding:0 20px}button{border:1px solid #75634f;color:#fff;background:none;padding:6px 12px;cursor:pointer}button.active{background:#856843}#review{position:absolute;top:48px;left:0;right:0;bottom:0;overflow:hidden}iframe{border:0;position:absolute;transform-origin:top left}</style></head><body><header><strong>Desktop QA</strong><button data-w="1440" data-h="900" class="active">1440 × 900</button><button data-w="1920" data-h="1080">1920 × 1080</button><button data-w="2560" data-h="1440">2560 × 1440</button><span id="size"></span><span id="media" style="margin-left:auto;font-size:11px"></span></header><div id="review"><iframe src="/" title="Restaurant desktop viewport"></iframe></div><script>let width=1440,height=900;const frame=document.querySelector('iframe'),area=document.querySelector('#review');function fit(){const scale=Math.min(area.clientWidth/width,area.clientHeight/height);Object.assign(frame.style,{width:width+'px',height:height+'px',transform:`scale(${scale})`,left:(area.clientWidth-width*scale)/2+'px'});document.querySelector('#size').textContent=`Viewport ${width} × ${height} · ${(scale*100).toFixed(0)}% preview`;}document.querySelectorAll('button').forEach(b=>b.onclick=()=>{width=+b.dataset.w;height=+b.dataset.h;document.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));fit()});new ResizeObserver(fit).observe(area);fit();setInterval(()=>{const doc=frame.contentDocument,video=doc?.querySelector('video');document.querySelector('#media').textContent=video?`Video ${video.paused?'paused':'playing'} · ${video.currentTime.toFixed(1)}s / ${video.duration.toFixed(1)}s · ${video.videoWidth}×${video.videoHeight} · opacity ${frame.contentWindow.getComputedStyle(video).opacity} · ready ${video.dataset.active}`:'Video fallback';},500);</script></body></html>
